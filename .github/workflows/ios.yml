name: Valuenable iOS Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  simulator:
    name: Build iOS Simulator .app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode information
        run: |
          xcodebuild -version
          xcodebuild -list -project SecureWorkspace.xcodeproj

      - name: Build Simulator app
        run: |
          set -euo pipefail
          rm -rf build/simulator
          xcodebuild clean build \
            -project SecureWorkspace.xcodeproj \
            -scheme SecureWorkspace \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package Simulator app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/simulator/Build/Products -maxdepth 2 -type d -name 'SecureWorkspace.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p artifacts/simulator
          ditto "$APP_PATH" artifacts/simulator/SecureWorkspace.app
          cd artifacts/simulator
          zip -qry ../../SecureWorkspace-iOS-Simulator.zip SecureWorkspace.app

      - name: Upload Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureWorkspace-iOS-Simulator
          path: SecureWorkspace-iOS-Simulator.zip
          if-no-files-found: error

  ipa:
    name: Build signed iOS IPA
    runs-on: macos-latest
    # A real installable IPA requires Apple signing credentials.
    if: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/valuenable-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print:UUID' /dev/stdin < <(security cms -D -i "$PROFILE_PATH"))
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist for ad-hoc IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > build-export-options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>in.valuenable.secureworkspace</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

      - name: Archive device build
        run: |
          set -euo pipefail
          rm -rf build/device
          xcodebuild archive \
            -project SecureWorkspace.xcodeproj \
            -scheme SecureWorkspace \
            -configuration Release \
            -archivePath "$PWD/build/device/SecureWorkspace.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='${{ secrets.IOS_TEAM_ID }}' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Export IPA
        run: |
          set -euo pipefail
          rm -rf artifacts/ipa
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/device/SecureWorkspace.xcarchive" \
            -exportPath "$PWD/artifacts/ipa" \
            -exportOptionsPlist "$PWD/build-export-options.plist"
          test -f artifacts/ipa/SecureWorkspace.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureWorkspace-iOS-IPA
          path: artifacts/ipa/SecureWorkspace.ipa
          if-no-files-found: error
